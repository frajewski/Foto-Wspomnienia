<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background: theme primary (#6750A4 — MD3 Material You purple) -->
  <rect width="1024" height="1024" fill="#6750A4"/>

  <!-- Camera body -->
  <rect x="192" y="352" width="640" height="432" rx="48" fill="#FFFFFF"/>

  <!-- Camera top bump (viewfinder housing) -->
  <rect x="384" y="272" width="256" height="96" rx="24" fill="#FFFFFF"/>

  <!-- Shutter button on top-right of body -->
  <rect x="720" y="392" width="64" height="24" rx="12" fill="#6750A4"/>

  <!-- Lens outer ring -->
  <circle cx="512" cy="568" r="156" fill="#6750A4"/>
  <!-- Lens glass -->
  <circle cx="512" cy="568" r="116" fill="#EADDFF"/>
  <!-- Lens inner -->
  <circle cx="512" cy="568" r="76" fill="#6750A4"/>
  <!-- Lens highlight -->
  <circle cx="488" cy="544" r="22" fill="#FFFFFF" opacity="0.9"/>

  <!-- Location pin overlay (top-right of icon) -->
  <g transform="translate(680, 168)">
    <!-- Pin teardrop shape -->
    <path d="M 96 0
             C 149 0, 192 43, 192 96
             C 192 156, 96 240, 96 240
             C 96 240, 0 156, 0 96
             C 0 43, 43 0, 96 0 Z"
          fill="#B3261E"
          stroke="#FFFFFF"
          stroke-width="8"/>
    <!-- Pin hole -->
    <circle cx="96" cy="96" r="36" fill="#FFFFFF"/>
  </g>
</svg>
